__use_yte__: true

name: ?f"Differential expression of {wildcards.contrast}"

datasets:
  diffexp:
    path: ?input.table
    separator: "\t"
    links:
      gene details:
        column: gene
        table-row: diffexp/gene

views:
  diffexp:
    dataset: diffexp
    desc: |
      Differential expression results calculated with DESeq2, sorted by adjusted p-value.
      Log2 fold changes are shrunken with ashr.
    spell:
      url: v1.7.0/tools/deseq2
  volcano-plot:
    dataset: diffexp
    desc: |
      Shrunken log2 fold change against adjusted p-value.
      Click on a gene to show its row in the results table.
    spell:
      url: v1.7.0/visualization/volcano-plot
      with:
        id_column: gene
        fold_change_column: log2FoldChange
        p_value_column: padj
        link: gene details
